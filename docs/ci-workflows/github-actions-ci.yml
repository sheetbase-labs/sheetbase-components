name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Unit tests
        run: bun run test

      - name: Build table demo and library
        working-directory: packages/table
        run: bun run build && bun run build:lib && bun run budget && bun run bench

      - name: Build explorer demo and library
        working-directory: packages/explorer
        run: bun run build && bun run build:lib && bun run bench

      - name: Build schema editor demo and library
        working-directory: packages/schema-editor
        run: bun run build && bun run build:lib

      - name: Build rules engine demo and library
        working-directory: packages/rules-engine
        run: bun run build && bun run build:lib

      - name: Build advanced search demo and library
        working-directory: packages/advanced-search
        run: bun run build && bun run build:lib

  table-e2e:
    name: Table Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Install Playwright browsers
        working-directory: packages/table
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright
        working-directory: packages/table
        env:
          E2E_BROWSER: ${{ matrix.browser }}
        run: bunx playwright test --project=${{ matrix.browser }}
