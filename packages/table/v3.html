<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheetbase v3 grid fixture</title>
    <!-- Faces: the design renders rasterise text in the platform UI font, not
         the Inter the canvas nominally requests (its @fontsource build never
         reaches the canvas string). The fixture pins the same stack so the
         crop is comparable. -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      /* The fixture renders the grid at the design's own box so the element
         screenshot is directly comparable with the crop. */
      #grid-fixture,
      #grid-fixture .spreadsheet {
        width: 855px;
        height: 293px;
      }
      #grid-fixture .spreadsheet {
        /* Match the design render's actual face: the platform UI font. */
        --font-sans: system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/v3-fixture.tsx"></script>
  </body>
</html>
