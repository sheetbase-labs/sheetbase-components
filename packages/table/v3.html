<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheetbase v3 grid fixture</title>
    <!-- The design canvas loads these (canvas/SheetWorking.dc.html <helmet>);
         the crop is only comparable if the fixture renders with the same faces. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      /* The fixture renders the grid at the design's own box so the element
         screenshot is directly comparable with the crop. */
      #grid-fixture,
      #grid-fixture .spreadsheet {
        width: 855px;
        height: 293px;
      }
      #grid-fixture .spreadsheet {
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/v3-fixture.tsx"></script>
  </body>
</html>
