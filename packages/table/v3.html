<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheetbase v3 grid fixtures</title>
    <!-- Faces: the design canvases request Inter / JetBrains Mono from Google
         Fonts and the ELN design-reference renderer answers those requests from
         the same @fontsource packages these fixtures now import, so the design
         renders and the fixtures rasterise the same faces. -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      /* The dispatcher sizes #grid-fixture to the fixture module's crop box;
         the grid fills it so the element screenshot is directly comparable
         with that crop. */
      #grid-fixture {
        position: relative;
      }
      #grid-fixture .spreadsheet {
        width: 100%;
        height: 100%;
        /* The @fontsource families (see src/ui/v3-fixture.tsx) carry a
           `Variable` suffix; the design canvas's `Inter` / `JetBrains Mono`
           names resolve to the same files. */
        --font-sans: "Inter Variable", system-ui, sans-serif;
        --font-mono: "JetBrains Mono Variable", ui-monospace, monospace;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/v3-fixture.tsx"></script>
  </body>
</html>
