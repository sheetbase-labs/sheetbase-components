name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build shared library
        working-directory: packages/shared
        run: bun run build:lib

      - name: Build table demo and library
        working-directory: packages/table
        run: bun run build && bun run build:lib && bun run budget && bun run bench

      - name: Build explorer demo and library
        working-directory: packages/explorer
        run: bun run build && bun run build:lib && bun run bench

      - name: Build schema editor demo and library
        working-directory: packages/schema-editor
        run: bun run build && bun run build:lib

      - name: Build rules engine demo and library
        working-directory: packages/rules-engine
        run: bun run build && bun run build:lib

      - name: Build advanced search demo and library
        working-directory: packages/advanced-search
        run: bun run build && bun run build:lib

      - name: Build studio demo and library
        working-directory: packages/studio
        run: bun run build && bun run build:lib

      - name: Pack smoke — tarballs install + typecheck as a consumer
        run: node scripts/pack-smoke.mjs --skip-build

  python:
    name: Python package (sheetbase-studio)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: bun install

      - name: Build the Studio UI into the package
        run: bun run --filter @sheetbase-labs/sheetbase-studio build:python

      - name: Install the package
        run: uv venv && uv pip install -e "python[dev]"

      - name: pytest (filter parity, backend, server, widget)
        run: .venv/bin/pytest python

      - name: TypeScript ↔ Python contract test
        env:
          SHEETBASE_PYTHON: ${{ github.workspace }}/.venv/bin/python
        working-directory: packages/studio
        run: bunx vitest run src/sources/python.test.ts

      - name: Build wheel
        run: uv build python --out-dir dist-python

      - uses: actions/upload-artifact@v4
        with:
          name: sheetbase-studio-wheel
          path: dist-python/*.whl

  table-e2e:
    name: Table Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Install Playwright browsers
        working-directory: packages/table
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright
        working-directory: packages/table
        env:
          E2E_BROWSER: ${{ matrix.browser }}
        run: bunx playwright test --project=${{ matrix.browser }}

  demo-e2e:
    name: Demo Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Install Playwright browsers
        working-directory: packages/demo
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: packages/demo
        run: bunx playwright test --project=chromium
