name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: DuckDB natives for the CLI tests
        run: bun run --filter sheetbase-studio-cli fetch:natives

      - name: Unit tests
        run: bun run test

      - name: Build shared library
        working-directory: packages/shared
        run: bun run build:lib

      - name: Build table demo and library
        working-directory: packages/table
        run: bun run build && bun run build:lib && bun run budget && bun run bench

      - name: Build explorer demo and library
        working-directory: packages/explorer
        run: bun run build && bun run build:lib && bun run bench

      - name: Build schema editor demo and library
        working-directory: packages/schema-editor
        run: bun run build && bun run build:lib

      - name: Build rules engine demo and library
        working-directory: packages/rules-engine
        run: bun run build && bun run build:lib

      - name: Build advanced search demo and library
        working-directory: packages/advanced-search
        run: bun run build && bun run build:lib

      - name: Build studio demo and library
        working-directory: packages/studio
        run: bun run build && bun run build:lib

      - name: Pack smoke — tarballs install + typecheck as a consumer
        run: node scripts/pack-smoke.mjs --skip-build

  python:
    name: Python package (sheetbase-studio)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: bun install

      - name: Build the Studio UI into the package
        run: bun run --filter @sheetbase-labs/sheetbase-studio build:python

      - name: Install the package
        run: uv venv && uv pip install -e "python[dev]"

      - name: pytest (filter parity, backend, server, widget)
        run: .venv/bin/pytest python

      - name: TypeScript ↔ Python contract test
        env:
          SHEETBASE_PYTHON: ${{ github.workspace }}/.venv/bin/python
        working-directory: packages/studio
        run: bunx vitest run src/sources/python.test.ts

      - name: Build wheel
        run: uv build python --out-dir dist-python

      - uses: actions/upload-artifact@v4
        with:
          name: sheetbase-studio-wheel
          path: dist-python/*.whl

  table-e2e:
    name: Table Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Install Playwright browsers
        working-directory: packages/table
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright
        working-directory: packages/table
        env:
          E2E_BROWSER: ${{ matrix.browser }}
        run: bunx playwright test --project=${{ matrix.browser }}

  demo-e2e:
    name: Demo Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Install Playwright browsers
        working-directory: packages/demo
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: packages/demo
        run: bunx playwright test --project=chromium

  studio-e2e:
    name: Studio Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Install Playwright browsers
        working-directory: packages/studio
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright (layout at phone → wall sizes)
        working-directory: packages/studio
        run: bunx playwright test --project=chromium

  # Pull requests build and smoke-test the Linux binary only. macOS and
  # Windows minutes cost 10x and 2x on private repos, so the other platforms
  # build on pushes to main, on manual runs and (always) in the release workflow.
  studio-binary:
    name: Studio binary (linux_amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Build
        working-directory: packages/studio-cli
        run: bun scripts/build-binary.ts linux_amd64

      - name: Smoke test
        working-directory: packages/studio-cli
        run: bun scripts/smoke.ts

  studio-binary-platforms:
    name: Studio binary (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Smoke-tested on their own OS; the other two are cross-compiled.
          - { os: ubuntu-latest, target: linux_arm64, smoke: false }
          - { os: macos-latest, target: osx_arm64, smoke: true }
          - { os: macos-latest, target: osx_amd64, smoke: false }
          - { os: windows-latest, target: windows_amd64, smoke: true }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Build
        working-directory: packages/studio-cli
        run: bun scripts/build-binary.ts ${{ matrix.target }}

      - name: Smoke test
        if: matrix.smoke
        working-directory: packages/studio-cli
        run: bun scripts/smoke.ts

  studio-databases:
    name: Studio binary against Postgres and MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: studio
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      SHEETBASE_TEST_POSTGRES: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      SHEETBASE_TEST_MYSQL: mysql://root:root@127.0.0.1:3306/studio
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Live database tests (seed + explore through the connectors)
        working-directory: packages/studio-cli
        shell: bash
        run: |
          bun run fetch:natives
          set -o pipefail
          bunx vitest run test/databases.test.ts 2>&1 | tee vitest.log || {
            # Surface the failure in the run summary (annotations).
            grep -E "Error|×|FAIL|→|expected" vitest.log | head -40 | sed 's/^/::error title=databases::/'
            exit 1
          }

      - name: Build and smoke-test the binary against both databases
        working-directory: packages/studio-cli
        run: bun scripts/build-binary.ts && bun scripts/smoke.ts

